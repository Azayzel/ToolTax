name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile scripts/tool_tax.py scripts/tool_tax_capture.py tests/test_tool_tax.py tests/test_capture.py tests/fixtures/fake_mcp_server.py
      - name: Test
        run: python -m unittest discover -s tests -v
